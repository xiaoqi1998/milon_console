version: "3.8"

services:
  milon-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: milon-api-server:latest
    container_name: milon-api-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DEFAULT_NETWORK=devNet
      - ALLOWED_ORIGINS=*
      - ENABLE_UTIL_SIGN=true # 启用工具签名功能
      # - SIGNER_PRIVATE_KEY=your_private_key_here
      # MILON_RPC_URL 会覆盖 SDK 内置 devNet 端点(含 chainId 绑定),端点迁移时
      # 忘了同步就会把流量指回废弃节点(2026-11-20 devnet.milonlabs.com 停摆教训),
      # 缺省不设、跟随 gosdk 内置值即可;确需临时覆盖再解开:
      # - MILON_RPC_URL=https://dev-api.milonlabs.com/v1/rpc
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - milon-network

networks:
  milon-network:
    driver: bridge
