[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milon-python-sdk"
version = "0.1.0"
description = "Python SDK for the Milon blockchain (faithful port of milon-go-sdk)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "blake3>=1.0",
    "coincurve>=18.0",
    "cryptography>=42.0",
    "py_ecc>=7.0",
    "base58>=2.1",
    "requests>=2.31",
    "grpcio>=1.60",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
milon_sdk = ["provider/IDL/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
